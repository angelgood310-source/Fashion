 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Fashion & Premium Products</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="home.css">

<body class="bg-stone-50 text-gray-900">

  <!-- Top Bar
  <div class="bg-black text-white text-xs text-center py-2 tracking-wider">
    FASHION & PREMIUM PRODUCTS • FREE DELIVERY ABOVE ₹2,999
  </div> -->

  <!-- Top Navigation Bar -->
  <header class="bg-white border-b sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-4">
      <a href="index.html" class="text-2xl font-serif font-bold tracking-wide">shopify</a>

      <nav class="flex flex-wrap items-center gap-20 text-sm font-medium justify-between">
        <a href="index.html" class="text-black font-bold border-b-2 border-black pb-1">Home</a>
        <a href="collection.html" class="text-gray-600 hover:text-black">Collections</a>
        <a href="product.html" class="text-gray-600 hover:text-black">Product Details</a>
        <a href="wishlist.html" class="text-gray-600 hover:text-black">Wishlist (<span id="wishCount">0</span>)</a>

        <a href="about.html" class="text-gray-600 hover:text-black">About</a>
        <a href="user-page.html" class="text-gray-600 hover:text-black">User Page</a>
        <a href="login.html" class="bg-black text-white px-3 py-1.5 rounded text-xs">Login</a>
      </nav>
    </div>
  </header>

  <!-- Hero Banner -->
  <section class="max-w-7xl mx-auto px-4 py-6">
    <div class="hero-box rounded-2xl p-8 md:p-14 text-white flex flex-col justify-between min-h-[320px]">
      <span class="bg-amber-400 text-black text-xs font-bold px-3 py-1 rounded-full w-fit">PREMIUM COLLECTION</span>
      <div class="max-w-xl my-4">
        <h1 class="text-3xl md:text-5xl font-serif font-bold mb-3">Fashion & Premium Essentials</h1>

      </div>
      <div class="flex gap-3">
        <a href="collections.html" class="bg-white text-black px-5 py-2.5 rounded-lg text-sm font-bold hover:bg-gray-200">Shop Collections</a>

    <h2 class="text-xl font-bold mb-4">Categories</h2>
    <div id="homeCategories" class="grid grid-cols-2 sm:grid-cols-5 gap-4"></div>

  <!-- Featured Products -->
  <section class="max-w-7xl mx-auto px-4 py-8">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-bold">Featured Products</h2>
